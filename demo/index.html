<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>kmap-term-tree Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 680px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 16px;
      color: #0f172a;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      font-size: 1.1rem;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    button.chip {
      background: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    button.chip:hover {
      background: #0284c7;
      color: white;
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #475569;
    }
    .tree-box {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      min-height: 220px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>KMap Termbaum (Term Tree)</h1>

    <div class="input-row">
      <input type="text" id="termInput" value="(2+a)(3-b)" placeholder="AsciiMath Term eingeben, z.B. 2a+3b" />
    </div>

    <div class="presets">
      <span style="font-size: 0.85rem; color: #64748b; align-self: center; margin-right: 4px;">Beispiele:</span>
      <button class="chip" onclick="setTerm('2a+3b')">2a+3b</button>
      <button class="chip" onclick="setTerm('(2+a)(3-b)')">(2+a)(3-b)</button>
      <button class="chip" onclick="setTerm('(a+b)/(c+d)')">(a+b)/(c+d)</button>
      <button class="chip" onclick="setTerm('2a + sin(3b)')">2a + sin(3b)</button>
      <button class="chip" onclick="setTerm('x^2 - 4')">x^2 - 4</button>
      <button class="chip" onclick="setTerm('sqrt(b^2 - 4ac)')">sqrt(b^2 - 4ac)</button>
      <button class="chip" onclick="setTerm('(-b + sqrt(b^2 - 4ac)) / (2a)')">(-b + sqrt(b^2 - 4ac)) / (2a)</button>
      <button class="chip" onclick="setTerm('5 - -2')">5 - -2</button>
    </div>

    <div class="controls">
      <label>
        <input type="checkbox" id="showLabels" onchange="toggleLabels(this.checked)"> Bezeichnungen anzeigen
      </label>
    </div>

    <div class="tree-box">
      <kmap-term-tree id="termTree" term="(2+a)(3-b)" showDetails></kmap-term-tree>
    </div>
  </div>

  <script type="module">
    import '../dist/src/kmap-term-tree.js';

    const input = document.getElementById('termInput');
    const tree = document.getElementById('termTree');

    input.addEventListener('input', (e) => {
      tree.term = e.target.value;
    });

    window.setTerm = function(val) {
      input.value = val;
      tree.term = val;
    };

    window.toggleLabels = function(checked) {
      tree.showLabels = checked;
    };
  </script>
</body>
</html>
